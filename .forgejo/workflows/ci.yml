name: CI

# Gates: secret scan -> test -> compile -> dependency audit.
# Implements the Head-of-Security ask (F5, SECURITY-TASK-CI-GATES-2026-09-15):
# healthcare-adjacent lane; CI must not be the org's lowest gate bar.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  gates:
    runs-on: docker
    timeout-minutes: 30
    container:
      # Proven pattern from KyaniteLabs/kinocut CI: ubuntu:24.04 apt+pip are
      # reachable from the runner; actions/checkout is NOT (runner cannot
      # reach gitea.com), so the checkout below is a manual clone.
      image: ubuntu:24.04@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c
    steps:
      - name: Install tooling (git, python3, gitleaks)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git python3 python3-pip python3-venv gitleaks

      - name: Checkout (manual clone)
        env:
          JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_TOKEN_FALLBACK: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          export GIT_TERMINAL_PROMPT=0
          TOKEN="${JOB_TOKEN:-${JOB_TOKEN_FALLBACK:-}}"
          if [ -z "$TOKEN" ]; then
            echo "clone token empty; secrets.GITHUB_TOKEN and github.token are unset"
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@git.kyanitelabs.tech/${REPO}.git" .
          if ! git fetch --depth 50 origin "$SHA"; then
            echo "SHA fetch failed; continuing at clone head (push events land on the branch head)"
          else
            git checkout --detach "$SHA"
          fi

      # --- Gate 1: secret scan (gitleaks, full cloned history) ---
      # Allowlist mechanism: a `.gitleaksignore` file at repo root
      # (fingerprint-per-finding, reviewed in PRs like code).
      - name: Secret scan (gitleaks)
        # `detect --source` syntax works on both noble's packaged 8.x and
        # current releases; scans full git history of the clone.
        run: gitleaks detect --source . --verbose

      # --- Gate 1.5: lock sanity (audit finding 2026-09-24: a header-only
      # lock merged green because nothing checked it) ---
      - name: Dependency lock sanity
        run: |
          pins=$(grep -c '==' requirements.lock.txt || true)
          if [ "$pins" -lt 60 ]; then
            echo "requirements.lock.txt has only $pins pins (expected >= 60) — regenerate per its header"; exit 1
          fi

      # --- Gate 2: synthetic test suite ---
      - name: Install dependencies (from the hash-exact lock)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r requirements.lock.txt pytest httpx
      - name: Test (synthetic suite)
        run: .venv/bin/python -m pytest tests/ -q

      # --- Gate 2.5: clean-room HTTP acceptance (audit 2026-09-24,
      # remediation 4: "drive every named feature through HTTP in BOTH
      # model-success and model-failure modes; mandatory in CI"). The
      # module boots the documented runtime and runs real ASGI round
      # trips per surface, with an in-process loopback OpenAI-compatible
      # fake for model-success mode. No new dependencies. ---
      - name: Acceptance gate (HTTP, model-failure + model-success)
        run: .venv/bin/python -m pytest tests/acceptance/ -q

      # --- Gate 3: compile ---
      - name: Compile
        run: .venv/bin/python -m compileall -q healthadvocate

      # --- Shared CI contract (KyaniteLabs/.github, pinned) ---
      # Layers 3, 5 and 6 from the org contract. The contract repo needs an
      # authenticated clone on this instance, so it uses the job token exactly
      # like the checkout above, into a path outside the workspace.
      - name: Check out the shared CI contract
        env:
          JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          set -eu
          export GIT_TERMINAL_PROMPT=0
          TOKEN="${JOB_TOKEN:-${JOB_TOKEN_FALLBACK:-}}"
          git clone --quiet --filter=blob:none --no-checkout "https://x-access-token:${TOKEN}@git.kyanitelabs.tech/KyaniteLabs/.github.git" /tmp/ci-contract
          git -C /tmp/ci-contract checkout --quiet acc41fc663d5b1ef623a406fddff912823b29f93

      # Layer 3: README blocks tagged ```bash readme-test run against this
      # checkout. Exit 2 = not applicable (no tagged blocks) passes.
      - name: Layer 3 executable README blocks
        shell: bash
        run: |
          set -uo pipefail
          script=/tmp/ci-contract/scripts/readme_exec.py
          [ -f "$script" ] || { echo "$script missing" >&2; exit 1; }
          rc=0
          python3 "$script" . || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "gate evidence: executable README check not applicable here"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # Layer 5: version and self-description consistency. Exit 2 = not
      # applicable (no package version source) passes.
      - name: Layer 5 self-description consistency
        shell: bash
        run: |
          set -uo pipefail
          script=/tmp/ci-contract/scripts/self_description_check.py
          [ -f "$script" ] || { echo "$script missing" >&2; exit 1; }
          rc=0
          python3 "$script" . || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "gate evidence: self-description check not applicable here"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # Layer 6: structure signals. Advisory: a snapshot that never fails the job.
      - name: Layer 6 structure signals (advisory)
        shell: bash
        run: |
          if ! python3 /tmp/ci-contract/scripts/structure_signals.py .; then
            echo "structure signals: not measured on this run (advisory)"
          fi

      # --- Gate 4: dependency audit (pip-audit) ---
      # Reviewer-approved allowlist: add `--ignore-vuln <ID>` lines below ONLY
      # with a justification comment; every entry is reviewed like code.
      - name: Dependency audit (pip-audit)
        run: |
          .venv/bin/pip install --quiet pip-audit
          # Audit what is actually installed (the lock), plus the intent file.
          .venv/bin/pip-audit -r requirements.lock.txt
