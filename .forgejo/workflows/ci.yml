name: CI

# Gates: secret scan -> test -> compile -> dependency audit.
# Implements the Head-of-Security ask (F5, SECURITY-TASK-CI-GATES-2026-09-15):
# healthcare-adjacent lane; CI must not be the org's lowest gate bar.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  gates:
    runs-on: docker
    timeout-minutes: 30
    container:
      # Proven pattern from KyaniteLabs/kinocut CI: ubuntu:24.04 apt+pip are
      # reachable from the runner; actions/checkout is NOT (runner cannot
      # reach gitea.com), so the checkout below is a manual clone.
      image: ubuntu:24.04
    steps:
      - name: Install tooling (git, python3, gitleaks)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git python3 python3-pip python3-venv gitleaks

      - name: Checkout (manual clone)
        env:
          JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_TOKEN_FALLBACK: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          export GIT_TERMINAL_PROMPT=0
          TOKEN="${JOB_TOKEN:-${JOB_TOKEN_FALLBACK:-}}"
          if [ -z "$TOKEN" ]; then
            echo "clone token empty; secrets.GITHUB_TOKEN and github.token are unset"
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@git.kyanitelabs.tech/${REPO}.git" .
          if ! git fetch --depth 50 origin "$SHA"; then
            echo "SHA fetch failed; continuing at clone head (push events land on the branch head)"
          else
            git checkout --detach "$SHA"
          fi

      # --- Gate 1: secret scan (gitleaks, full cloned history) ---
      # Allowlist mechanism: a `.gitleaksignore` file at repo root
      # (fingerprint-per-finding, reviewed in PRs like code).
      - name: Secret scan (gitleaks)
        # `detect --source` syntax works on both noble's packaged 8.x and
        # current releases; scans full git history of the clone.
        run: gitleaks detect --source . --verbose

      # --- Gate 1.5: lock sanity (audit finding 2026-09-24: a header-only
      # lock merged green because nothing checked it) ---
      - name: Dependency lock sanity
        run: |
          pins=$(grep -c '==' requirements.lock.txt || true)
          if [ "$pins" -lt 60 ]; then
            echo "requirements.lock.txt has only $pins pins (expected >= 60) — regenerate per its header"; exit 1
          fi

      # --- Gate 2: synthetic test suite ---
      - name: Install dependencies (from the hash-exact lock)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r requirements.lock.txt pytest httpx
      - name: Test (synthetic suite)
        run: .venv/bin/python -m pytest tests/ -q

      # --- Gate 3: compile ---
      - name: Compile
        run: .venv/bin/python -m compileall -q healthadvocate

      # --- Gate 4: dependency audit (pip-audit) ---
      # Reviewer-approved allowlist: add `--ignore-vuln <ID>` lines below ONLY
      # with a justification comment; every entry is reviewed like code.
      - name: Dependency audit (pip-audit)
        run: |
          .venv/bin/pip install --quiet pip-audit
          # Audit what is actually installed (the lock), plus the intent file.
          .venv/bin/pip-audit -r requirements.lock.txt
