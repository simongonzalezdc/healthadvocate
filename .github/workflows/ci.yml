name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run presentability tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: License and provenance gate
        run: python -m healthadvocate.governance --project-root . --out build/receipts/license

      - name: Compile Python sources
        run: python -m compileall -q healthadvocate openmed
